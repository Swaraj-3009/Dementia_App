spring.config.import=optional:file:../../.env[.properties]

# ==========================================
# Dementia-Care Application
# Spring Boot Datasource Configuration
# ==========================================

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/dementia_app?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

# Credentials are supplied through environment variables.
# Never put real credentials directly in this file.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
# Fail application startup if the database connection cannot be established.
spring.datasource.hikari.initialization-fail-timeout=1

# ==========================================
# Spring Boot Server
# ==========================================

server.port=8080

# Comma-separated browser origins. Set APP_CORS_ALLOWED_ORIGINS to the exact
# HTTPS frontend URL in production; do not use a wildcard with credentials.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# Cross-origin session cookies require None/Secure in production. Keep local
# HTTP development usable unless deployment variables override these defaults.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Emergency contact configuration
# Leave blank until the team configures an actual emergency contact.
emergency.contact.name=${EMERGENCY_CONTACT_NAME:}
emergency.contact.phone=${EMERGENCY_CONTACT_PHONE:}
