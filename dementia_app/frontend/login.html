<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MemorySaathi - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<main class="login-container">

    <div class="login-card">

        <h1>MemorySaathi</h1>

        <h2>Sign in</h2>

        <p class="login-description">
            Choose your account type to access your dashboard.
        </p>

        <form id="login-form">

            <label for="login-role">I am a</label>
            <select id="login-role" name="role">
                <option value="caregiver">Caregiver</option>
                <option value="patient">Patient</option>
            </select>

            <label for="identifier">
                Username or Email
            </label>

            <input
                type="text"
                id="identifier"
                name="identifier"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="large-button login-button"
                id="login-button"
            >
                Login
            </button>

        </form>

        <p
            id="login-status"
            class="login-status"
            aria-live="polite"
        ></p>

        <hr>
        <h2>Create caregiver account</h2>
        <form id="register-form">
            <input name="name" required maxlength="100" placeholder="Your name">
            <input name="username" required maxlength="100" placeholder="Username">
            <input name="email" type="email" required maxlength="150" placeholder="Email">
            <input name="phone" maxlength="20" placeholder="Phone number">
            <input name="password" type="password" required minlength="8" placeholder="Password (at least 8 characters)">
            <button type="submit" class="large-button login-button">Create account</button>
        </form>

        <div class="demo-login-note">

            <strong>Local Demo Account</strong>

            <p>
                Username: demo_caregiver
            </p>

            <p>
                Password: Demo@123
            </p>

            <p>
                This credential is for local SIH demonstration only.
            </p>

            <p>
                Patient username: demo_patient<br>
                Patient password: Demo@123
            </p>

        </div>

    </div>

</main>

<script src="js/config.js"></script>
<script type="module" src="js/login.js"></script>

</body>

</html>
