<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MemorySaathi - Caregiver Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<main class="login-container">

    <div class="login-card">

        <h1>MemorySaathi</h1>

        <h2>Caregiver Login</h2>

        <p class="login-description">
            Sign in to access the caregiver dashboard.
        </p>

        <form id="login-form">

            <label for="identifier">
                Email or Username
            </label>

            <input
                type="text"
                id="identifier"
                name="identifier"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="large-button login-button"
                id="login-button"
            >
                Login
            </button>

        </form>

        <p
            id="login-status"
            class="login-status"
            aria-live="polite"
        ></p>

        <div class="demo-login-note">

            <strong>Local Demo Account</strong>

            <p>
                Username: demo_caregiver
            </p>

            <p>
                Password: Demo@123
            </p>

            <p>
                This credential is for local SIH demonstration only.
            </p>

        </div>

    </div>

</main>

<script src="js/login.js"></script>

</body>

</html>
