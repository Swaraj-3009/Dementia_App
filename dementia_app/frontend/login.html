<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cognicare · Sign in</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body data-page-title="Sign in">

<main class="login-container">

    <div class="login-card">

        <h1 data-i18n="appName">Cognicare</h1>

        <label class="language-control login-language-control"><span data-i18n="language">Language</span>
            <select class="language-select" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="as">অসমীয়া</option><option value="ne">नेपाली</option><option value="mni">ꯃꯤꯇꯩꯂꯣꯟ</option></select>
        </label>

        <h2 data-i18n="signIn">Sign in</h2>

        <p class="login-description">
            <span data-i18n="accountHelp">Choose your account type to access your care space.</span>
        </p>

        <form id="login-form">

            <label for="login-role" data-i18n="careTeam">Care team</label>
            <select id="login-role" name="role">
                <option value="caregiver" data-i18n="caregiver">Caregiver</option>
                <option value="patient" data-i18n="patient">Patient</option>
            </select>

            <label for="identifier">
                <span data-i18n="usernameOrEmail">Username or email</span>
            </label>

            <input
                type="text"
                id="identifier"
                name="identifier"
                autocomplete="username"
                required
            >

            <label for="password">
                <span data-i18n="password">Password</span>
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="large-button login-button"
                id="login-button"
            >
                <span data-i18n="login">Login</span>
            </button>

        </form>

        <p
            id="login-status"
            class="login-status"
            aria-live="polite"
        ></p>

        <hr>
        <h2 data-i18n="createAccount">Create caregiver account</h2>
        <form id="register-form">
            <input name="name" required maxlength="100" placeholder="Your name">
            <input name="username" required maxlength="100" placeholder="Username">
            <input name="email" type="email" required maxlength="150" placeholder="Email">
            <input name="phone" maxlength="20" placeholder="Phone number">
            <input name="password" type="password" required minlength="8" placeholder="Password (at least 8 characters)">
            <button type="submit" class="large-button login-button" data-i18n="register">Create account</button>
        </form>

    </div>

</main>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script type="module" src="js/login.js"></script>

</body>

</html>
